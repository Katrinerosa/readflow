<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="#22C55E" opacity="0.1"/>

  <!-- Magnifying glass -->
  <circle cx="85" cy="85" r="35" fill="none" stroke="#22C55E" stroke-width="6"/>
  <line x1="110" y1="110" x2="140" y2="140" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>

  <!-- Book inside magnifying glass -->
  <rect x="65" y="70" width="25" height="30" rx="2" fill="#8B5CF6"/>
  <rect x="78" y="70" width="2" height="30" fill="#6D28D9"/>
  <line x1="68" y1="78" x2="76" y2="78" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="68" y1="84" x2="76" y2="84" stroke="#ffffff" stroke-width="1"/>
  <line x1="68" y1="89" x2="76" y2="89" stroke="#ffffff" stroke-width="1"/>

  <!-- Sparkles -->
  <circle cx="140" cy="60" r="4" fill="#F97316"/>
  <circle cx="50" cy="140" r="3" fill="#8B5CF6"/>
</svg>